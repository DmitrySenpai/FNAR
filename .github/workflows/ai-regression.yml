name: FNAR AI, power and tablet-fault regression
on:
  push:
    paths:
      - 'fnar-ai.js'
      - 'fnar-power.js'
      - 'fnar-tablet-faults.js'
      - 'app.js'
      - 'tablet-os.js'
      - 'tablet-os.css'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/ai-regression.yml'
  pull_request:
    paths:
      - 'fnar-ai.js'
      - 'fnar-power.js'
      - 'fnar-tablet-faults.js'
      - 'app.js'
      - 'tablet-os.js'
      - 'tablet-os.css'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/ai-regression.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check fnar-ai.js
          node --check fnar-power.js
          node --check fnar-tablet-faults.js
          node --check tablet-os.js
          node --check app.js
      - name: Test night, power and tablet faults
        run: node --test tests/*.test.cjs
