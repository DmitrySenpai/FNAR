name: FNAR release validation

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          set -e
          for file in app.js fnar-ai.js fnar-power.js fnar-audio-settings.js fnar-atmosphere.js fnar-endings.js fnar-tablet-faults.js tablet-os.js phone-dialogues.js fnar-audio.js; do
            node --check "$file"
          done
          if test -f fnar-company.js; then node --check fnar-company.js; fi
      - name: Run every regression and resource test
        run: node --test tests/*.test.cjs
